  header:
    - '&#33cccc&m                                                '
    - ''
    - '&#66ffff&lCELEST HUB'
    - '&#99ffffWelcome back, &f%player%'
    - ''
  footer:
    - ''
    - '&#80ffffYou are currently in hub with &#4ddfff%online% &#80ffffplayers'
    - '&#ccffffstore.celest.net &8| &#ccffffdiscord.gg/celest'
