TITLE: "&8Trails Menu"
SIZE: 36
FILLER: false

BUTTONS:
  TRAIL:
    ALLOWED:
      ICON:
        NAME: "&a&l✧ &f%trail_name% Trail &a&l✧"
        LORE:
          - "&7&m------------------------------"
          - "&aClick to equip this trail."
          - "&7&m------------------------------"
    DENIED:
      ICON:
        NAME: "&4&l✘ &f%trail_name% Trail &4&l✘"
        MATERIAL: "RED_WOOL"
        DATA: 0
        LORE:
          - "&7&m------------------------------"
          - "&cYou don't have this trail,"
          - "&cpurchase at celest.net"
          - "&7&m------------------------------"
    EQUIPPED:
      ICON:
        NAME: "&b&l✦ &f%trail_name% Trail &b&l✦"
        LORE:
          - "&7&m------------------------------"
          - "&bYou have already equipped"
          - "&bthis trail."
          - "&7&m------------------------------"
    REMOVE:
      ICON:
        NAME: "&c&lRemove Trail"
        LORE:
          - "&7&m------------------------------"
          - "&7Click to remove your "
          - "&7currently trail."
          - ""
          - "&fSelected Trail: &b%trail_name%"
          - "&7&m------------------------------"
        MATERIAL: "BRUSH"
        DATA: 0

