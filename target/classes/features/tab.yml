tablist-name-formatting:
  enabled: true
  format: '{lp_prefix}%player%{lp_suffix}'

nametag:
  enabled: true
  prefix: '{lp_prefix}'
  suffix: '{lp_suffix}'

group-sorting:
  enabled: true
  groups:
    - owner
    - admin
    - default
